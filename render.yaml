# Plano de despliegue para Render (https://render.com).
# En Render: New > Blueprint > elige este repositorio. Crea la web.
# La base de datos está en Neon (plan gratuito): pega su dirección en DATABASE_URL.
# Al crearlo, Render pide DATABASE_URL y la contraseña del administrador (DJANGO_SUPERUSER_PASSWORD).
services:
  - type: web
    name: dragonboat
    runtime: python
    plan: free
    # Frankfurt: cerca de España y de la base de datos de Neon (Londres).
    region: frankfurt
    buildCommand: ./build.sh
    startCommand: gunicorn config.wsgi:application
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      # Dirección de la base de datos de Neon (postgresql://...); se pone a mano en Render.
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: NEWS_API_TOKEN
        generateValue: true
      - key: WEB_CONCURRENCY
        value: 2
      - key: COMMUNITY_REQUIRES_APPROVAL
        value: "false"
      # Administrador de la web: se crea solo en el primer despliegue.
      - key: DJANGO_SUPERUSER_USERNAME
        value: andoni
      - key: DJANGO_SUPERUSER_EMAIL
        sync: false
      - key: DJANGO_SUPERUSER_PASSWORD
        sync: false
