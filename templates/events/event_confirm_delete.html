{% extends "base.html" %}
{% load i18n %}
{% block title %}{% translate "Borrar evento" %}{% endblock %}
{% block content %}
<div class="wrap page">
  <div class="panel form-card">
    <h1>{% translate "¿Borrar este evento?" %}</h1>
    <p><strong>{{ event.title }}</strong></p>
    <p class="muted small">{% translate "No se puede deshacer." %}</p>
    <form method="post" class="form-actions">
      {% csrf_token %}
      <button class="btn btn-danger" type="submit">{% translate "Sí, borrar" %}</button>
      <a href="{{ event.get_absolute_url }}">{% translate "Cancelar" %}</a>
    </form>
  </div>
</div>
{% endblock %}
