{% load site_tags %}
{# Siempre hay una ilustración del deporte; encima va la foto (subida o del medio original) si la hay y carga bien. #}
<div class="media" {% if sport %}style="--sport: {{ sport.color }}"{% endif %}>
  <img class="media-art" src="{% cover_art sport seed %}" alt="" aria-hidden="true" loading="lazy">
  {% if image %}
    <img class="media-photo" src="{{ image.url }}" alt="{{ alt }}" loading="lazy">
  {% elif image_url %}
    <img class="media-photo" src="{{ image_url }}" alt="{{ alt }}" loading="lazy" referrerpolicy="no-referrer"
         onerror="this.remove()" onload="if (this.naturalWidth && this.naturalWidth < 320) this.remove()">
    {% if credit %}<span class="media-credit">📷 {{ credit }}</span>{% endif %}
  {% endif %}
</div>
