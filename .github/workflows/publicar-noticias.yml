name: Publicar noticias

# Publica en la web el resumen semanal de noticias.
# La tarea programada de cada lunes deja el fichero noticias/semana.json en la
# rama `noticias-semanales`; este flujo lo envía a la web por la API.
# Necesita el secreto NEWS_API_TOKEN (Settings > Secrets and variables > Actions),
# con el mismo valor que la variable NEWS_API_TOKEN de Render.

on:
  push:
    branches: [noticias-semanales]
  workflow_dispatch:

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Publicar en la web
        env:
          SITE_URL: ${{ vars.SITE_URL || 'https://dragonboat-ih42.onrender.com' }}
          NEWS_API_TOKEN: ${{ secrets.NEWS_API_TOKEN }}
        run: |
          if [ ! -f noticias/semana.json ]; then
            echo "No hay noticias/semana.json en esta rama: nada que publicar."
            exit 0
          fi
          if [ -z "$NEWS_API_TOKEN" ]; then
            echo "::error::Falta el secreto NEWS_API_TOKEN en GitHub (Settings > Secrets and variables > Actions)."
            exit 1
          fi
          python scripts/publicar_noticias.py noticias/semana.json
